version: '3.8'
services:
  db:
    image: postgres:15
    container_name: library_db
    env_file: [.env]
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  app:
    build: .
    container_name: library_api
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on: [db]
    command: sh -c "sleep 5 && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: